[project]
name = "campaignpilot-ai-backend"
version = "0.1.0"
description = "FastAPI backend for CampaignPilot AI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.116.0",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.41",
  "alembic==1.16.2",
  "psycopg[binary]==3.2.9",
  "langchain==1.3.9",
  "langchain-core==1.4.7",
  "langchain-openai==1.3.2",
  "langchain-elasticsearch==1.0.0",
  "openai>=2.26.0,<3.0.0",
  "elasticsearch[vectorstore-mmr]>=8.19.0,<9.0.0",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "aiofiles==24.1.0",
  "httpx==0.28.1",
  "pypdf==5.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that require a configured database"
]
